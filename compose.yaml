services:
  mongodb1:
    container_name: mongodb1
    image: mongo:latest #  dh-mirror.gitverse.ru/ с зеркала не загружался, ошибка в конце загрузки
    volumes:
      - mongodb1_data_container:/data/db

  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongodb1
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongodb1"
      MONGODB_DATABASE_NAME: "somedb"


volumes:
  mongodb1_data_container:
